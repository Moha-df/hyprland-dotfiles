# Taille du curseur
cursor_size 24

# Forme
cursor_shape default  # default, block, beam, underline

# Traînée derrière le curseur
cursor_trail_enabled true
cursor_trail_color 0xFF00FF   # couleur flashy
cursor_trail_length 10        # longueur de la traînée

# Particules autour du curseur
cursor_particles_enabled true
cursor_particles_color 0x00FFFF
cursor_particles_size 5
cursor_particles_count 20     # nombre de particules
cursor_particles_lifetime 0.5 # secondes de vie des particules

# Blink (clignotement)
cursor_blink_enabled true
cursor_blink_interval 0.5

# Animation de l’effet quand tu colles
cursor_paste_trail_enabled true
cursor_paste_trail_color 0xFFAA00
cursor_paste_trail_length 15

